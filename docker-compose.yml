services:
  lumina:
    image: ghcr.io/ayxos/lumina:latest
    container_name: lumina
    environment:
      TZ: Europe/Berlin
      DATA_DIR: /data
      CONFIG_PATH: /config/settings.json
    volumes:
      - ./config:/config
      - ./data:/data
      # Add your media folder (or symlink ./media → your library). See docker-compose.override.example.yml.
      # Always run `docker compose up -d` — passing `-f docker-compose.yml` alone skips override files.
      - ./media:/media/photos:ro
      # - /path/to/more/media:/media/videos:ro
    ports:
      - "3080:3080"
    restart: unless-stopped
